title: Erin Rowling's Story Shelf
author_name: Erin Rowling
tagline: Stories and poems from a young writer who loves to write.
description: "Erin Rowling's Story Shelf. Stories and poems by Erin Rowling, a young writer from South Korea. Erin Rowling is a pen name, in honor of the author's favorite writer, J.K. Rowling."
url: https://shakingspeare.github.io
baseurl: ""

permalink: /:year/:title/
timezone: Asia/Seoul

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - README.md
  - templates/
  - preview.command
  - worker/
